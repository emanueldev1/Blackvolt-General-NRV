name: release

# Push a tag like v0.2.0 to publish a release. The in-app updater downloads the
# Blackvolt-<version>-win-x64.zip asset and checks it against the .sha256 next to it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (X.Y.Z); crea la etiqueta vX.Y.Z en este commit'
        required: true
      publish:
        description: 'Publicar el Release (si no, solo deja el zip como artefacto para probar)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq 'workflow_dispatch') { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          $v = $v.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "La versión debe ser X.Y.Z (es $v)" }
          "value=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.vcpkg-cache" | Out-Null

      - name: Restore vcpkg packages
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-v2-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-v2-

      - name: Fetch NVIDIA SDK and runtimes
        shell: pwsh
        run: ./scripts/fetch-sdks.ps1

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'

      - name: Python tools for chiaki-ng's protocol code generator
        shell: pwsh
        run: '& "${{ steps.python.outputs.python-path }}" -m pip install --disable-pip-version-check protobuf grpcio-tools'

      - name: Configure engine
        run: cmake --preset windows-x64 "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"
        timeout-minutes: 90

      - name: Build engine (Release)
        run: cmake --build --preset release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Publish app
        run: >
          msbuild app/Blackvolt.App/Blackvolt.App.csproj /restore /t:Publish
          /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true
          /p:Version=${{ steps.version.outputs.value }} /p:PublishDir=${{ github.workspace }}\publish\Blackvolt\
          /v:minimal

      - name: Ship the Visual C++ runtime next to the app
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
                 Where-Object { $_.FullName -notmatch 'onecore|debug' } | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "No se encontró el runtime de Visual C++ en el runner" }
          Copy-Item "$($crt.FullName)\*.dll" publish/Blackvolt/ -Force
          Get-ChildItem publish/Blackvolt -Filter *.pri | ForEach-Object Name
          if (-not (Test-Path publish/Blackvolt/Blackvolt.pri)) { throw "Falta Blackvolt.pri: la interfaz no cargaría" }

      - name: Smoke test (the window must open and stay open)
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish/Blackvolt -Recurse -Filter Blackvolt.exe | Select-Object -First 1
          if (-not $exe) { throw "No se encontró Blackvolt.exe" }
          $crash = Join-Path $env:LOCALAPPDATA 'Blackvolt\crash.log'
          Remove-Item $crash -ErrorAction SilentlyContinue
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if (Test-Path $crash) { Get-Content $crash }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Blackvolt' } | Select-Object -First 5 | Format-List TimeCreated, ProviderName, Id, Message
          if ($p.HasExited) { throw "Blackvolt se cerró al arrancar (código $($p.ExitCode))" }
          "Ventana: 0x{0:X} · título '{1}'" -f $p.MainWindowHandle.ToInt64(), $p.MainWindowTitle
          Stop-Process -Id $p.Id -Force
          if (Test-Path $crash) { throw "Blackvolt registró un error al arrancar" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "Blackvolt-${{ steps.version.outputs.value }}-win-x64.zip"
          Copy-Item LICENSE, NOTICE.md publish/Blackvolt/
          if (-not (Test-Path publish/Blackvolt/Blackvolt.exe)) { throw "Falta Blackvolt.exe en el paquete" }
          Compress-Archive -Path publish/Blackvolt -DestinationPath $name -CompressionLevel Optimal
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Out-File "$name.sha256" -Encoding ascii -NoNewline
          "zip=$name" >> $env:GITHUB_OUTPUT

      - name: Keep the package as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackvolt-${{ steps.version.outputs.value }}-win-x64
          path: publish/Blackvolt
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $zip = "${{ steps.package.outputs.zip }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip "$zip.sha256" --clobber
          } else {
            gh release create $tag $zip "$zip.sha256" --target "${{ github.sha }}" `
              --title "Blackvolt ${{ steps.version.outputs.value }}" --generate-notes
          }
