name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.vcpkg-cache" | Out-Null

      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-v2-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-v2-

      - name: Fetch NVIDIA SDK and runtimes
        shell: pwsh
        run: ./scripts/fetch-sdks.ps1

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'

      - name: Python tools for chiaki-ng's protocol code generator
        shell: pwsh
        run: '& "${{ steps.python.outputs.python-path }}" -m pip install --disable-pip-version-check protobuf grpcio-tools'

      - name: Configure engine
        # Pin CMake to the interpreter that has grpcio-tools (the runner has several Pythons).
        run: cmake --preset windows-x64 "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"
        timeout-minutes: 90

      - name: Save vcpkg packages
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-v2-${{ hashFiles('vcpkg.json') }}

      - name: Build engine
        run: cmake --build --preset debug

      - name: Test engine
        run: ctest --preset debug --output-on-failure --timeout 900

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Build app
        run: msbuild app/Blackvolt.App/Blackvolt.App.csproj /restore /p:Configuration=Debug /p:Platform=x64 /v:minimal

      - name: Show XAML compiler output
        if: failure()
        shell: pwsh
        run: Get-ChildItem app -Recurse -Filter output.json | ForEach-Object { Get-Content $_.FullName }
