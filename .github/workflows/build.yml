name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/.vcpkg-cache" | Out-Null

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Fetch NVIDIA SDK and runtimes
        shell: pwsh
        run: ./scripts/fetch-sdks.ps1

      - name: Configure engine
        run: cmake --preset windows-x64
        timeout-minutes: 90

      - name: Build engine
        run: cmake --build --preset debug

      - name: Test engine
        run: ctest --preset debug

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Build app
        run: msbuild app/Blackvolt.App/Blackvolt.App.csproj /restore /p:Configuration=Debug /p:Platform=x64 /v:minimal

      - name: Show XAML compiler output
        if: failure()
        shell: pwsh
        run: Get-ChildItem app -Recurse -Filter output.json | ForEach-Object { Get-Content $_.FullName }
